# Column descriptions for the released NBA stats datasets (spec D43).
#
# Authored for THIS league against the real stats.nba.com payloads and the
# published parquets. Never borrowed from another sport's schema store -- a
# borrowed description is an invented one (the WBB pilot's borrowed store
# produced `assists` = "Assisted tackles").
#
# Keyed by column NAME: a column means the same thing in every dataset that
# carries it (`game_id` is always the zero-padded stats.nba.com game id). A
# column with no entry renders as an empty cell in the generated docs, which
# is an honest TODO. Priority coverage: pbp, schedules, the schedule-master
# artifacts, and the shared identity/join keys.

# --- identity / join keys -----------------------------------------------------
game_id: >-
  stats.nba.com game id, zero-padded 10-char string ("0022300001"; the "00"
  prefix is the NBA league id, so the id must never round-trip through int).
season: >-
  Season the row belongs to. On the reshaped release assets it is the season's
  ENDING year as an integer, matching the asset filename (2024 = the 2023-24
  season) -- the 2026-08-13 republish moved every `nba_stats_*` asset onto
  END-year names and the column was converted with them. The span form
  ("2023-24") survives only where a payload carries its own season column.
  `draft` and `draft_combine` are the exception in the other direction: their
  integer is the four-digit draft year (2003 = the June 2003 draft, which
  precedes the 2003-04 season).
season_id: >-
  stats.nba.com composite season id: season-type digit + start year
  ("22023" = 2023-24 regular season).
season_type: >-
  Season type the capture was made under ("Regular Season", "Playoffs", ...).
season_type_id: >-
  Leading digit of season_id encoding the season type (2 = regular season,
  4 = playoffs, 5 = play-in).
league_id: >-
  stats.nba.com league id ("00" = NBA).
team_id: >-
  stats.nba.com team id (Int64, e.g. 1610612737 = Atlanta Hawks).
person_id: >-
  stats.nba.com person id of the player (or official) the row describes; the
  same id space as player_id.
player_id: >-
  stats.nba.com person id of the player (Int64); joins rosters, boxscores,
  game logs and pbp (`person_id`).
player_name: >-
  Player display name as the stats API ships it ("LeBron James").
official_id: >-
  stats.nba.com person id of the game official.
team_abbreviation: >-
  Three-letter team code ("ATL").
team_tricode: >-
  Three-letter team code as the v3 endpoints name it ("ATL").
team_name: >-
  Team nickname or full name as the source endpoint ships it.
team_city: >-
  Team city name.

# --- pbp (playbyplayv3) -------------------------------------------------------
action_number: >-
  Ordinal of the action within the game as numbered by the stats feed;
  monotone but not gapless (video-only actions are skipped).
action_id: >-
  Feed-internal id of the action row.
clock: >-
  Game clock at the action in ISO-8601 duration form ("PT11M32.00S").
period: >-
  Period number (1-4; 5+ = overtime).
player_name_i: >-
  Abbreviated player name ("L. James").
x_legacy: >-
  Shot x-coordinate in the legacy stats.nba.com coordinate frame (tenths of
  feet from the basket centerline; null for non-shots).
y_legacy: >-
  Shot y-coordinate in the legacy coordinate frame (tenths of feet from the
  baseline; null for non-shots).
shot_distance: >-
  Shot distance in feet (0 for non-shots).
shot_result: >-
  "Made" / "Missed" for shot actions; empty otherwise.
is_field_goal: >-
  1 when the action is a field-goal attempt, else 0.
score_home: >-
  Home score after the action (string; carried forward between scores).
score_away: >-
  Away score after the action (string; carried forward between scores).
points_total: >-
  Points the acting team has scored through this action.
location: >-
  Which side the acting team is on: "h" (home) or "v" (visitor).
description: >-
  Human-readable action narrative from the feed.
action_type: >-
  Action family ("Made Shot", "Rebound", "Turnover", "Foul", ...).
sub_type: >-
  Action detail within the family ("Jump Shot", "Offensive", ...).
shot_value: >-
  Point value of a shot attempt (2 or 3; 1 for free throws, 0 for non-shots).
video_available: >-
  1 when the feed links video for the action/game row.

# --- schedules / game logs (leaguegamelog) ------------------------------------
game_date: >-
  Game date as the source ships it (calendar date, US Eastern).
matchup: >-
  Matchup string from the log ("ATL @ BOS" away, "ATL vs. BOS" home).
wl: >-
  Result from the row team's perspective: "W" or "L".
min: >-
  Team (or player) minutes in the log row.
fgm: Field goals made.
fga: Field goals attempted.
fg_pct: Field-goal percentage (0-1).
fg3m: Three-point field goals made.
fg3a: Three-point field goals attempted.
fg3_pct: Three-point percentage (0-1).
ftm: Free throws made.
fta: Free throws attempted.
ft_pct: Free-throw percentage (0-1).
oreb: Offensive rebounds.
dreb: Defensive rebounds.
reb: Total rebounds.
ast: Assists.
stl: Steals.
blk: Blocks.
tov: Turnovers.
pf: Personal fouls.
pts: Points.
plus_minus: >-
  Point differential while on the floor (player rows) or final margin
  (team rows).

# --- schedule master / games_in_data_repo (D34) -------------------------------
in_pbp: >-
  True when the game's play-by-play made it into a compiled season release.
in_game_rosters: >-
  True when the game is present in the compiled game_rosters release.
in_officials: >-
  True when the game is present in the compiled officials release.
in_player_boxscores: >-
  True when the game is present in the compiled player_boxscores release.
in_team_boxscores: >-
  True when the game is present in the compiled team_boxscores release.
game_code: >-
  Schedule game code ("YYYYMMDD/AWYHOM").
game_status: >-
  Numeric game state (1 scheduled, 2 live, 3 final).
game_status_text: >-
  Human-readable game state ("Final", tip time for scheduled games).
game_sequence: >-
  Order of the game within its date in the schedule feed.
game_date_est: Game datetime, US Eastern (date part).
game_time_est: Game tip time, US Eastern.
game_date_time_est: Game datetime, US Eastern.
game_date_utc: Game date, UTC.
game_time_utc: Game tip time, UTC.
game_date_time_utc: Game datetime, UTC.
home_team_id: stats.nba.com team id of the home team.
away_team_id: stats.nba.com team id of the away team.
home_team_name: Home team nickname.
away_team_name: Away team nickname.
home_team_city: Home team city.
away_team_city: Away team city.
home_team_tricode: Home team three-letter code.
away_team_tricode: Away team three-letter code.
home_team_slug: Home team URL slug.
away_team_slug: Away team URL slug.
home_team_score: Home final (or current) score.
away_team_score: Away final (or current) score.
home_team_wins: Home team wins entering/at the game, per the schedule feed.
home_team_losses: Home team losses entering/at the game, per the schedule feed.
away_team_wins: Away team wins entering/at the game, per the schedule feed.
away_team_losses: Away team losses entering/at the game, per the schedule feed.
home_team_seed: Home team playoff seed (playoff games; 0 otherwise).
away_team_seed: Away team playoff seed (playoff games; 0 otherwise).
home_team_time: Tip time in the home team's local timezone.
away_team_time: Tip time in the away team's local timezone.
arena_name: Arena the game is played in.
arena_city: Arena city.
arena_state: Arena state/territory code.
is_neutral: True for neutral-site games.
week_name: Schedule-feed week label ("Week 3").
week_number: Schedule-feed week number (0 for preseason/unassigned).
month_num: Schedule-feed month ordinal.
day: Day-of-week abbreviation from the schedule feed.
game_label: >-
  Special-game label from the schedule feed ("NBA Cup", "Preseason", empty
  for ordinary games).
game_sub_label: >-
  Special-game sub-label ("Championship", group names, usually empty).
game_subtype: >-
  Schedule-feed subtype slug for special games (in-season tournament stages).
series_game_number: Playoff series game number ("Game 5"; empty otherwise).
series_text: Playoff series state text ("BOS leads 3-2"; empty otherwise).
if_necessary: '"true"/"false": whether a scheduled playoff game is conditional.'
postponed_status: Postponement flag from the schedule feed ("A" = active/none).
branch_link: NBA app deep link for the game.
season_type_description: >-
  Human-readable season type ("Regular Season", "Playoffs", "PlayIn").
PBP: >-
  Legacy availability flag carried over from the pre-registry hoopR schedule
  tree; superseded by in_pbp and kept only because the committed master still
  carries it.

# --- draft (drafthistory) -----------------------------------------------------
# Authored against the real 1996-2025 payloads: 1,773 picks, all DRAFT_TYPE
# "Draft", rounds 1-2 throughout (the NBA has been a two-round draft since 1989).
round_number: >-
  Draft round the pick was made in (1 or 2 across the published 1996-2025
  range; earlier drafts ran to more rounds).
round_pick: >-
  Pick number WITHIN the round (the 5th pick of round 2 is round_pick 5, not
  35). Use overall_pick for draft-wide order.
overall_pick: >-
  Pick number across the whole draft, 1 = first overall.
draft_type: >-
  How the player entered the league. "Draft" for every pick in the published
  range; the value exists to distinguish historical dispersal, expansion and
  territorial drafts in older seasons.
organization: >-
  School, club or national team the player came from ("Syracuse", "KK Vrsac
  (Serbia)"). Populated for ~99.9% of NBA picks; the WNBA twin ships it empty.
organization_type: >-
  Category of `organization`: "College/University" (1,395 of the 1,773 picks
  1996-2025), "Other Team/Club" (333; mostly international clubs), "High
  School" (43) or empty (2 -- Thon Maker 2016, Mitchell Robinson 2018, both of
  whom also ship an empty `organization`). Note "High School" is not confined
  to the pre-2006 prep-to-pro era: it is whatever the API last recorded, and
  it recurs in 2015-2020 for picks with no college of record.
player_profile_flag: >-
  1 when stats.nba.com hosts a player profile for the pick, 0 when it does not
  (166 of 1,773 picks 1996-2025). Largely tracks whether the pick ever reached
  the NBA, but it is a profile-existence flag rather than a games-played one,
  so it should not be read as a career indicator on its own.

# --- per-game matchups (`game_matchups`) --------------------------------------
#
# One row per (game, offensive player, defender). `off_` is the player being
# guarded and `def_` the player guarding -- measured against the traditional
# boxscore, not taken from the payload's field order (see
# `reshape/build.py::matchup_rows`).
side: >-
  Which side of the game the OFFENSIVE player's team was on: "home" or "away".
off_person_id: >-
  stats.nba.com person id of the offensive player -- the one being guarded.
def_person_id: >-
  stats.nba.com person id of the defender guarding the offensive player.
off_team_id: >-
  Team id of the offensive player. Taken from the payload's team block.
def_team_id: >-
  Team id of the defender, read from the game envelope's homeTeamId/awayTeamId
  rather than the nested team object, which is 0 on uncovered captures.
matchup_minutes: >-
  Time the pair were matched up, as the payload's MM:SS string; use
  `matchup_minutes_sort` for arithmetic.
matchup_minutes_sort: >-
  The same matchup time in seconds, as a float -- the sortable/summable form.
partial_possessions: >-
  Possessions credited to the matchup. Fractional because a possession is split
  across every defender who guarded the ball-handler during it, which is why
  matchup counting stats do not sum exactly to a player's game totals.
percentage_offensive_total_time: >-
  Share of the offensive player's floor time spent guarded by this defender.
percentage_defender_total_time: >-
  Share of the defender's floor time spent guarding this offensive player.
percentage_total_time_both_on: >-
  Share of the time both players were on the floor together that they were
  matched up.
switches_on: >-
  Times the defense switched this defender onto the offensive player.
player_points: >-
  Points the offensive player scored while guarded by this defender.
team_points: >-
  Points the offensive player's team scored while this matchup was on.
matchup_assists: >-
  Assists by the offensive player while guarded by this defender.
matchup_potential_assists: >-
  Passes by the offensive player that would have been assists had the shot
  fallen, while guarded by this defender.
matchup_turnovers: >-
  Turnovers by the offensive player while guarded by this defender.
matchup_blocks: >-
  Shots by the offensive player blocked by this defender.
matchup_field_goals_made: >-
  Field goals made by the offensive player against this defender.
matchup_field_goals_attempted: >-
  Field goals attempted by the offensive player against this defender.
matchup_field_goals_percentage: >-
  Field-goal percentage of the offensive player against this defender.
matchup_three_pointers_made: >-
  Three-pointers made by the offensive player against this defender.
matchup_three_pointers_attempted: >-
  Three-pointers attempted by the offensive player against this defender.
matchup_three_pointers_percentage: >-
  Three-point percentage of the offensive player against this defender.
matchup_free_throws_made: >-
  Free throws made by the offensive player on trips drawn against this defender.
matchup_free_throws_attempted: >-
  Free throws attempted by the offensive player on trips drawn against this
  defender.
help_blocks: >-
  Blocks by this defender on the offensive player when helping off another
  assignment rather than as the primary defender.
help_field_goals_made: >-
  Field goals the offensive player made against this defender in help defense.
help_field_goals_attempted: >-
  Field goals the offensive player attempted against this defender in help
  defense.
help_field_goals_percentage: >-
  Field-goal percentage allowed by this defender in help defense.
shooting_fouls: >-
  Shooting fouls committed by this defender on the offensive player.
off_team_city: >-
  City/market of the offensive player's team ("Indiana").
off_team_name: >-
  Nickname of the offensive player's team ("Pacers") -- pair with
  `off_team_city` for the full club name.
off_team_tricode: >-
  Three-letter abbreviation of the offensive player's team ("IND").
off_team_slug: >-
  URL slug of the offensive player's team ("pacers").
off_first_name: >-
  First name of the offensive player.
off_family_name: >-
  Family name of the offensive player.
off_name_i: >-
  Offensive player's abbreviated display name ("B. Mathurin").
off_player_slug: >-
  URL slug of the offensive player ("bennedict-mathurin").
off_position: >-
  Starting position of the offensive player as the payload reports it; empty
  for players who did not start.
off_comment: >-
  Availability note on the offensive player (DNP reason); empty when they
  played.
off_jersey_num: >-
  Jersey number of the offensive player, as a string (it can carry a leading
  zero, e.g. "00").
def_first_name: >-
  First name of the defender.
def_family_name: >-
  Family name of the defender.
def_name_i: >-
  Defender's abbreviated display name ("J. Allen").
def_player_slug: >-
  URL slug of the defender ("jarrett-allen").
def_jersey_num: >-
  Jersey number of the defender, as a string (it can carry a leading zero).
