name: Update NBA Stats Data

# Python-only since 2026-08-02. The scrape lives in hoopR-nba-stats-raw (its
# droplet cron owns filling the raw store); this job only COMPILES + PUBLISHES:
# it reads the raw store over raw.githubusercontent.com, builds parquet+rds+csv,
# and uploads to the nba_stats_* release tags. No stats.nba.com calls; the only
# commit is the schedule family (master + manifest + coverage, spec D34) --
# dataset artifacts stay release-only. The retired R chain scraped v2 pbp and
# committed raw JSON into this repo, both of which are now the raw repo's job
# (and the committed JSON was purged in 02341942).
on:
  schedule:
    - cron: '0 7 18-31 10 *'
    - cron: '0 7 * 11-12 *'
    - cron: '0 7 * 1-6 *'
    - cron: '0 7 1-12 7 *'
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string

permissions:
  contents: write   # release uploads

jobs:
  build_publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
      GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
      HOOPR_NBA_STATS_RAW_ROOT: https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-stats-raw/main/nba_stats/json
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Default season window
        if: ${{ inputs.start_year == '' }}
        # NBA season-year rollover is October (month <= 9 -> previous year);
        # replaces the retired Rscript/hoopR lookup with the same rule.
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          if [ "$((10#$m))" -le 9 ]; then y=$((y - 1)); fi
          season=$((y + 1))   # repo convention: season labeled by end year
          echo "START_YEAR=$season" >> "$GITHUB_ENV"
          echo "END_YEAR=$season" >> "$GITHUB_ENV"

      - name: Inputs override
        if: ${{ inputs.start_year != '' }}
        run: |
          echo "START_YEAR=${{ inputs.start_year }}" >> "$GITHUB_ENV"
          echo "END_YEAR=${{ inputs.end_year || inputs.start_year }}" >> "$GITHUB_ENV"

      - name: Build + publish
        run: |
          HOOPR_NBA_STATS_PYBIN="$(pwd)/.venv/bin/python" \
            bash scripts/daily_nba_stats_python_processor.sh -s "$START_YEAR" -e "$END_YEAR"

      # The one exception to "no commits": the schedule family (spec D34/D36).
      # The processor's stage-99 steps restamp the built window's season
      # schedule flags and rebuild the master + games_in_data_repo manifest +
      # coverage index; those live in the tree, not on a release tag.
      - name: Commit schedule master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nba_stats/schedules/parquet \
                     nba_stats/nba_stats_schedule_master.parquet \
                     nba_stats/nba_stats_games_in_data_repo.parquet \
                     nba_stats/nba_stats_schedule_coverage.parquet
          git diff --cached --quiet || {
            git commit -m "chore(schedule): refresh schedule master + coverage (${START_YEAR}-${END_YEAR})"
            git push
          }
