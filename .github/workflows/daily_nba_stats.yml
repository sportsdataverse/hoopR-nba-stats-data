name: Update NBA Stats Data

# Python-only since 2026-08-02. The scrape lives in hoopR-nba-stats-raw (its
# droplet cron owns filling the raw store); this job only COMPILES + PUBLISHES:
# it reads the raw store over raw.githubusercontent.com, builds parquet+rds+csv,
# and uploads to the nba_stats_* release tags. No stats.nba.com calls. The
# processor commits each season's built PARQUET under nba_stats/{key}/parquet/
# (owner rule 2026-09-30: parquet in the tree, all three formats on the
# release); the step below commits the stage-99 schedule master (spec D34). The retired R chain scraped v2 pbp and
# committed raw JSON into this repo, both of which are now the raw repo's job
# (and the committed JSON was purged in 02341942).
# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and because the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Observed here on 2026-08-19: runs 32204419012 and 32204417571 started
# in the same minute from two repository_dispatch events, and the first hit
# "! [rejected] main -> main (non-fast-forward)" while reporting success.
#
# cancel-in-progress is FALSE on purpose -- these runs also upload release
# assets, and cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 7 18-31 10 *'
    - cron: '0 7 * 11-12 *'
    - cron: '0 7 * 1-6 *'
    - cron: '0 7 1-12 7 *'
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string

permissions:
  contents: write   # release uploads

jobs:
  build_publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
      GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
      HOOPR_NBA_STATS_RAW_ROOT: https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-stats-raw/main/nba_stats/json
    steps:
      # A run queued behind another one (the concurrency group above) would check
      # out the SHA from when it was TRIGGERED, before the earlier run's commits.
      # Take the branch tip at job start instead, so a queued run builds on what
      # the run before it pushed. A literal, like the helper's `origin main`: an
      # expression that came back empty would silently restore the event SHA.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Default season window
        if: ${{ inputs.start_year == '' }}
        # NBA season-year rollover is October (month <= 9 -> previous year);
        # replaces the retired Rscript/hoopR lookup with the same rule.
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          if [ "$((10#$m))" -le 9 ]; then y=$((y - 1)); fi
          season=$((y + 1))   # repo convention: season labeled by end year
          echo "START_YEAR=$season" >> "$GITHUB_ENV"
          echo "END_YEAR=$season" >> "$GITHUB_ENV"

      - name: Inputs override
        if: ${{ inputs.start_year != '' }}
        run: |
          echo "START_YEAR=${{ inputs.start_year }}" >> "$GITHUB_ENV"
          echo "END_YEAR=${{ inputs.end_year || inputs.start_year }}" >> "$GITHUB_ENV"

      - name: Build + publish
        run: |
          HOOPR_NBA_STATS_PYBIN="$(pwd)/.venv/bin/python" \
            bash scripts/daily_nba_stats_python_processor.sh -s "$START_YEAR" -e "$END_YEAR"

      # The stage-99 schedule master (spec D34/D36): the processor rebuilds the
      # master + games_in_data_repo manifest + coverage index from the raw
      # store's scheduleleaguev2 and the committed tree; those live in the tree,
      # not on a release tag.
      - name: Commit schedule master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            nba_stats/nba_stats_schedule_master.parquet
            nba_stats/nba_stats_games_in_data_repo.parquet
            nba_stats/nba_stats_schedule_coverage.parquet
          )
          # Through the shared helper, not a bare `git push`: it commits first, then
          # fetches and rebases if the push is rejected. A bare push loses to any
          # commit that lands during the build: the WNBA twin's run 37207505807
          # (2026-10-04) built and published, then failed this same step on
          # "! [rejected] main -> main (non-fast-forward)".
          # The helper stages with `git add ... || true`, and one missing path makes
          # git stage NOTHING, which then reads as "nothing to commit". Fail instead,
          # as the bare `git add` did.
          ls -d "${paths[@]}" >/dev/null
          source scripts/_commit.sh
          sdv_commit_push "chore(schedule): refresh schedule master + coverage (${START_YEAR}-${END_YEAR})" "${paths[@]}"
