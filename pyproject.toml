[project]
name = "hoopr-nba-stats-data-build"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.66",
    "curl-cffi>=0.15.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["nba_data_build*", "nba_model_publish*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    # Reads the committed nba_stats/ tree or the sibling raw store. Deselected
    # in PR CI, which sparse-checkouts the code only.
    "archive: requires committed payload trees",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col(...) == True) are the project convention.
ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
# Generated D39 models mirror the published column names verbatim; standings
# ships literal `w` / `l` win-loss columns.
"python/nba_data_build/models.py" = ["E741"]
